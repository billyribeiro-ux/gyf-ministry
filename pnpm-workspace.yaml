allowBuilds:
  sharp: true
  esbuild: true
engineStrict: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/browser-playwright': 5.0.5
overrides:
  # NFT currently recognizes Sharp 0.34's entry point; keep build/runtime copies aligned.
  sharp: ~0.34.5
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
patchedDependencies:
  '@sveltejs/adapter-vercel@7.0.2': patches/@sveltejs__adapter-vercel@7.0.2.patch
