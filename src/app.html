<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Suppress third-party browser extension message-channel rejections on SPA navigation
			(function () {
				function isExtensionChannelError(msg) {
					return (
						typeof msg === 'string' &&
						(msg.indexOf('message channel closed before a response was received') !== -1 ||
							msg.indexOf('A listener indicated an asynchronous response by returning true') !== -1)
					);
				}
				window.addEventListener(
					'unhandledrejection',
					function (event) {
						var reason = event && event.reason;
						var msg =
							reason && typeof reason.message === 'string' ? reason.message : String(reason);
						if (isExtensionChannelError(msg)) {
							event.preventDefault();
							event.stopImmediatePropagation();
						}
					},
					true
				);
				window.addEventListener(
					'error',
					function (event) {
						if (event && isExtensionChannelError(event.message)) {
							event.preventDefault();
							event.stopImmediatePropagation();
						}
					},
					true
				);
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,400..600&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
